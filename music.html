<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Daftar Music - ZATIFY</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1><span>ZATI</span>FY</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="music.html">Music</a>
        <a href="search.html">Search</a>
        <a href="favorite.html">Favorite</a>
        <a href="feedback.html">Feedback</a>
      </nav>
    </header>

    <!-- Konten Utama -->
    <main id="daftar">
      <section>
        <h2>Mu<span>sic</span></h2>

        <p class="text">Temukan berbagai musik favoritmu di ZATIFY.</p>

        <!-- Pilihan urutan musik -->
        <select id="daftar-sort">
          <option value="default">Urutkan Music</option>
          <option value="az">A - Z</option>
          <option value="za">Z - A</option>
        </select>

        <!-- Tempat menampilkan card musik -->
        <div id="daftar-container"></div>
      </section>
    </main>

    <!-- Modal Player -->
    <div id="player-modal">
      <div class="player-box">
        <button id="player-close">X</button>

        <h2 id="player-title"></h2>

        <iframe
          id="player"
          allow="autoplay *; encrypted-media *; fullscreen *"
        ></iframe>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <div class="footer-about">
          <h3>ZATI<span>FY</span></h3>

          <p>
            Temukan dan dengarkan musik favoritmu, kapan aja dan di mana aja.
          </p>
        </div>

        <div class="footer-links">
          <h4>Jelajahi</h4>

          <a href="index.html">Home</a>
          <a href="music.html">Daftar Music</a>
          <a href="search.html">Search</a>
          <a href="favorite.html">Favorite</a>
          <a href="feedback.html">Masukan</a>
        </div>
      </div>

      <p class="footer-bottom">
        ZATIFY &copy; 2026 — Find Your Vibe, Play Your Music. 🎧
      </p>
    </footer>

    <script src="music.js"></script>
  </body>
</html>
