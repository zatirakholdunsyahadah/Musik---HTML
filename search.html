<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Search - ZATIFY</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1><span>ZATI</span>FY</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="music.html">Music</a>
        <a href="search.html">Search</a>
        <a href="favorite.html">Favorite</a>
        <a href=" feedback.html">Feedback</a>
      </nav>
    </header>

    <!-- Konten Utama -->
    <main id="search">
      <section>
        <h2>Search <span>Music</span></h2>

        <p class="text">Cari lagu atau artist favoritmu.</p>

        <!-- Form Search -->
        <form id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Cari lagu atau artist..."
          />

          <button type="button" id="search-button">Search</button>
        </form>

        <!-- Hasil Search -->
        <div id="search-container"></div>
      </section>
    </main>

    <!-- Player -->
    <div id="player-modal">
      <div class="player-box">
        <button id="player-close">X</button>

        <h2 id="player-title"></h2>

        <iframe
          id="player"
          allow="autoplay *; encrypted-media *; fullscreen *"
        ></iframe>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <div class="footer-about">
          <h3>ZATI<span>FY</span></h3>

          <p>
            Temukan dan dengarkan musik favoritmu, kapan aja dan di mana aja.
          </p>
        </div>

        <div class="footer-links">
          <h4>Jelajahi</h4>

          <a href="index.html">Home</a>
          <a href="music.html">Daftar Music</a>
          <a href="search.html">Search</a>
          <a href="favorite.html">Favorite</a>
          <a href="feedback.html">Masukan</a>
        </div>
      </div>

      <p class="footer-bottom">
        ZATIFY &copy; 2026 — Find Your Vibe, Play Your Music. 🎧
      </p>
    </footer>

    <script src="search.js"></script>
  </body>
</html>
